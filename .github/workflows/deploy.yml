# Builds the static export and publishes it to GitHub Pages.
#
# Free without a minute cap on public repositories, so nothing is metered here.
#
# One-time setup in the repository, under Settings > Pages:
#   Source          GitHub Actions
#   Custom domain   hefcap.com
#
# The DNS records have to point at GitHub before the certificate can be issued;
# see the apex A records and the www CNAME in README terms below.
#
# Two files in /public matter to Pages and are copied into out/ by next build:
#   CNAME       keeps the custom domain attached across deployments
#   .nojekyll   stops Jekyll from discarding /_next, whose name starts with an
#               underscore. Without it every stylesheet and script 404s.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Belt and braces: the file is in /public, but a missing .nojekyll breaks
      # the whole site in a way that is not obvious from the build log.
      - run: touch out/.nojekyll

      - name: Check the export produced something
        run: |
          test -f out/index.html
          test -d out/sr
          test -d out/en
          test -f out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
