# Builds the site on GitHub Actions and ships the finished `out/` folder to
# Netlify as a prebuilt deploy.
#
# Netlify build minutes are only consumed when Netlify itself runs the build.
# Deploying an already-built directory through the CLI does not touch them, and
# GitHub Actions is free without a minute cap on public repositories.
#
# Before this works, two things have to be done by hand, once:
#
#   1. Add two repository secrets under Settings > Secrets and variables >
#      Actions:
#        NETLIFY_AUTH_TOKEN  a personal access token from Netlify, under
#                            User settings > Applications > Personal access
#                            tokens
#        NETLIFY_SITE_ID     the site's API ID, under Site configuration >
#                            General > Site details
#
#   2. Stop Netlify from building the same commit itself, otherwise both run
#      and the minutes are spent anyway: Site configuration > Build & deploy >
#      Continuous deployment > Build settings > Stop builds.
#
# netlify.toml stays where it is. The CLI reads it from the repository root, so
# the cache headers for /_next/static and /images still apply.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Fail loudly rather than deploying an empty site if the export changed.
      - name: Check the export produced something
        run: test -f out/index.html && test -d out/sr

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=out --prod --message "GitHub Actions ${{ github.sha }}"
