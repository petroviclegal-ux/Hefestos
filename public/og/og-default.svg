<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hefestos Capital — Investment Banking and M&amp;A Advisory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161C25"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A1F35" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7A1F35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A03A50"/>
      <stop offset="0.55" stop-color="#7A1F35"/>
      <stop offset="1" stop-color="#4A1220"/>
