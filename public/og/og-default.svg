  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="url(#fade)" stroke-width="1.5" fill="none">
    <line x1="-50" y1="640" x2="1250" y2="470"/>
    <line x1="-50" y1="600" x2="1250" y2="410"/>
    <line x1="-50" y1="560" x2="1250" y2="350"/>
    <line x1="-50" y1="520" x2="1250" y2="290"/>
    <line x1="-50" y1="480" x2="1250" y2="230"/>
  </g>

  <!-- Monogram: interlaced square knot -->
  <g transform="translate(90 88) scale(1.04)" fill="url(#m)">
    <rect x="22" y="0" width="30" height="8"/><rect x="66" y="0" width="30" height="8"/>
    <rect x="22" y="8" width="8" height="34"/><rect x="44" y="8" width="8" height="12"/><rect x="66" y="8" width="8" height="34"/><rect x="88" y="8" width="8" height="22"/>
    <rect x="0" y="22" width="20" height="8"/><rect x="32" y="22" width="32" height="8"/><rect x="76" y="22" width="12" height="8"/>
    <rect x="0" y="30" width="8" height="22"/><rect x="44" y="32" width="8" height="32"/>
    <rect x="8" y="44" width="34" height="8"/><rect x="54" y="44" width="42" height="8"/><rect x="88" y="52" width="8" height="22"/>
    <rect x="22" y="54" width="8" height="42"/><rect x="66" y="54" width="8" height="42"/>
    <rect x="0" y="66" width="20" height="8"/><rect x="32" y="66" width="32" height="8"/><rect x="76" y="66" width="12" height="8"/>
    <rect x="0" y="74" width="8" height="22"/><rect x="44" y="76" width="8" height="20"/>
    <rect x="8" y="88" width="14" height="8"/><rect x="52" y="88" width="14" height="8"/>
  </g>

  <text x="232" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F7F5F0" letter-spacing="4">HEFESTOS</text>
  <text x="234" y="182" font-family="Arial, sans-serif" font-size="24" fill="#A03A50" letter-spacing="14">CAPITAL</text>

  <text x="96" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#F7F5F0">
    <tspan x="96" dy="0">Building bridges in</tspan>
    <tspan x="96" dy="74">emerging markets.</tspan>
  </text>

  <text x="96" y="556" font-family="Arial, sans-serif" font-size="25" fill="#F7F5F0" fill-opacity="0.65">Independent investment banking &#38; M&#38;A advisory &#183; Since 2001</text>
