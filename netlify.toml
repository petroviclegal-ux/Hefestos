# Netlify deployment configuration for the Hefestos Capital site.
#
# The site is a statically-exported Next.js app: `npm run build` writes a fully
# static site to `out/`, which Netlify serves directly (no server runtime).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Match the local toolchain (Node 24).
  NODE_VERSION = "24"

# Long-cache the immutable Next.js asset bundles (hashed filenames).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images can be cached for a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
